<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم فروش و مدیریت بارکد</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
    #reader video {
      object-fit: cover !important;
      border-radius: 0.75rem;
    }
    
    @media print {
      body * {
        visibility: hidden;
      }
      #print-page-a4, #print-page-a4 * {
        visibility: visible;
      }
      #print-page-a4 {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: grid !important;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 10px;
      }
      .label-card {
        border: 1px dashed #bbb;
        padding: 6px;
        text-align: center;
        page-break-inside: avoid;
        border-radius: 6px;
      }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-3 md:p-6 font-sans select-none">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-md overflow-hidden p-5">
    
    <!-- تب‌های بالای صفحه -->
    <div class="flex border-b mb-4">
      <button id="tab-scan-btn" onclick="switchTab('scan')" class="flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600">فروش و اسکن</button>
      <button id="tab-manage-btn" onclick="switchTab('manage')" class="flex-1 py-2 font-bold text-gray-500">مدیریت اجناس</button>
    </div>

    <!-- ==================== بخش فروش و اسکن ==================== -->
    <div id="tab-scan">
      <div class="relative mb-4">
        <div id="reader" class="w-full rounded-xl border overflow-hidden bg-black min-h-[220px]"></div>
        <button id="torch-btn" onclick="toggleTorch()" class="hidden absolute top-3 left-3 bg-white/80 backdrop-blur-md text-gray-800 p-2 rounded-lg text-xs font-bold shadow z-10 flex items-center gap-1">
          🔦 چراغ‌قوه
        </button>
      </div>

      <!-- اطلاعات محصول اسکن شده -->
      <div id="product-info" class="hidden bg-blue-50 p-4 rounded-xl border border-blue-100 mb-4">
        <h2 id="product-name" class="font-bold text-gray-800 text-lg mb-1"></h2>
        <p class="text-sm text-gray-600 mb-3">قیمت واحد: <span id="product-price" class="font-semibold text-blue-600"></span> تومان</p>
        
        <div class="flex items-center justify-between gap-2 mb-3">
          <span class="text-sm font-medium text-gray-700">تعداد / مقدار:</span>
          <div class="flex items-center border border-gray-300 rounded-xl bg-white overflow-hidden shadow-sm">
            <button onclick="changeQty(-1)" class="w-12 h-11 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold text-xl active:bg-gray-300 transition flex items-center justify-center">−</button>
            <input type="number" id="quantity" value="1" min="1" readonly class="w-14 text-center font-bold text-lg text-blue-700 bg-transparent outline-none">
            <button onclick="changeQty(1)" class="w-12 h-11 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold text-xl active:bg-gray-300 transition flex items-center justify-center">+</button>
          </div>
        </div>

        <div class="flex gap-2">
          <button onclick="addToCart()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow">
            افزودن به فاکتور
          </button>
          <button onclick="cancelScan()" class="bg-gray-200 text-gray-700 px-4 py-3 rounded-xl font-bold hover:bg-gray-300 transition">
            انصراف
          </button>
        </div>
      </div>

      <!-- سبد خرید -->
      <div class="border-t pt-4">
        <h3 class="font-bold text-gray-700 mb-2">اقلام فاکتور:</h3>
        <ul id="cart-list" class="divide-y divide-gray-100 text-sm text-gray-600 mb-4 min-h-[50px]">
          <li class="py-2 text-center text-gray-400">هنوز کالایی اضافه نشده است.</li>
        </ul>

        <div class="flex justify-between items-center font-bold text-lg text-gray-800 border-t pt-3 mb-4">
          <span>جمع کل:</span>
          <div><span id="total-price">0</span> <span class="text-sm font-normal">تومان</span></div>
        </div>

        <button id="send-btn" onclick="sendToTelegram()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition shadow">
          ارسال فاکتور به تلگرام
        </button>
      </div>
    </div>

    <!-- ==================== بخش مدیریت اجناس ==================== -->
    <div id="tab-manage" class="hidden">
      <!-- ثبت تکی کالا / تولید بارکد جدید -->
      <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-4">
        <h3 class="font-bold text-gray-800 mb-3 text-sm">ثبت کالا (با بارکد یا تولید خودکار)</h3>
        <div class="space-y-3">
          <div>
            <label class="text-xs text-gray-600 block mb-1">کد بارکد:</label>
            <div class="flex gap-2">
              <input type="text" id="new-barcode" placeholder="بارکد یا کد تولیدی" class="flex-1 p-2 border rounded-lg text-sm dir-ltr">
              <button onclick="generateRandomBarcode()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg text-xs font-bold transition">
                ⚡ تولید کد
              </button>
            </div>
          </div>

          <div>
            <label class="text-xs text-gray-600 block mb-1">نام کالا:</label>
            <input type="text" id="new-name" placeholder="مثلاً: حبوبات (بسته ۱ کیلویی)" class="w-full p-2 border rounded-lg text-sm">
          </div>

          <div>
            <label class="text-xs text-gray-600 block mb-1">قیمت (تومان):</label>
            <input type="number" id="new-price" placeholder="مثلاً: 45000" class="w-full p-2 border rounded-lg text-sm">
          </div>

          <button onclick="saveProduct()" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-indigo-700 transition">
            ذخیره کالا در سیستم
          </button>
        </div>
      </div>

      <!-- تنظیمات چاپ چندتایی لیبل روی A4 -->
      <div id="batch-print-box" class="bg-blue-50 p-4 rounded-xl border border-blue-200 mb-4 hidden">
        <h3 class="font-bold text-blue-900 text-sm mb-2">🖨️ تنظیمات چاپ چندتایی روی برگه A4</h3>
        <p id="selected-print-title" class="text-xs text-blue-700 mb-2"></p>
        
        <div class="flex items-center gap-2 mb-3">
          <label class="text-xs text-gray-700 font-bold">تعداد برچسب روی A4:</label>
          <input type="number" id="print-count" value="24" min="1" max="60" class="w-16 p-1 border rounded text-center text-sm font-bold">
        </div>

        <div class="flex gap-2">
          <button onclick="executeBatchPrint()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-xs font-bold hover:bg-blue-700">
            چاپ برگه A4
          </button>
          <button onclick="cancelPrint()" class="bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-xs">
            انصراف
          </button>
        </div>
      </div>

      <!-- لیست کالاهای ذخیره‌شده -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <h3 class="font-bold text-gray-700 text-sm">لیست اجناس (<span id="products-count">0</span> کالا):</h3>
          <button onclick="exportCSV()" class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded hover:bg-gray-300">دانلود خروجی اکسل</button>
        </div>
        <div id="products-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
      </div>
    </div>

  </div>

  <!-- پاپ‌آپ مدال ثبت کالای ناشناخته -->
  <div id="unknown-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 max-w-sm w-full text-center shadow-xl">
      <div class="text-3xl mb-2">⚠️</div>
      <h3 class="font-bold text-gray-800 text-lg mb-2">کالای ناشناخته</h3>
      <p class="text-sm text-gray-600 mb-4">بارکد <span id="modal-barcode" class="font-bold font-mono text-blue-600"></span> در سیستم پیدا نشد. آیا می‌خواهید آن را ثبت کنید؟</p>
      <div class="flex gap-2">
        <button onclick="goToRegisterProduct()" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-blue-700">
          ثبت کالا
        </button>
        <button onclick="closeUnknownModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl font-bold text-sm hover:bg-gray-300">
          بستن و اسکن مجدد
        </button>
      </div>
    </div>
  </div>

  <!-- منطقه مخصوص چاپ برگه A4 -->
  <div id="print-page-a4" class="hidden"></div>

  <script>
    // ⚠️ آدرس Worker اختصاصی خود را وارد کنید
    const WORKER_URL = "https://my-telegram-proxy.xxxx.workers.dev";

    let database = JSON.parse(localStorage.getItem('grocery_db')) || {};
    let currentProduct = null;
    let selectedPrintItem = null;
    let tempBarcode = "";
    let cart = [];
    let html5QrCode = null;
    let isTorchOn = false;
    let isProcessingScan = false;

    const scanConfig = {
      fps: 15,
      qrbox: { width: 260, height: 160 },
      aspectRatio: 1.0,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_39
      ]
    };

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        scanConfig,
        onScanSuccess
      ).then(() => {
        const capabilities = html5QrCode.getRunningTrackCapabilities();
        if (capabilities.torch) document.getElementById('torch-btn').classList.remove('hidden');
      }).catch(err => console.error("خطا در دوربین:", err));
    }

    function toggleTorch() {
      isTorchOn = !isTorchOn;
      html5QrCode.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] });
    }

    function onScanSuccess(decodedText) {
      if (isProcessingScan) return; // اگر در حال پردازش اسکن قبلی است، اسکن جدید انجام نشود

      isProcessingScan = true;
      try { html5QrCode.pause(); } catch(e){} // متوقف کردن اسکنر

      const product = database[decodedText];

      if (product) {
        currentProduct = { barcode: decodedText, ...product };
        document.getElementById('product-name').innerText = product.name;
        document.getElementById('product-price').innerText = product.price.toLocaleString();
        document.getElementById('quantity').value = 1;
        document.getElementById('product-info').classList.remove('hidden');
      } else {
        tempBarcode = decodedText;
        document.getElementById('modal-barcode').innerText = decodedText;
        document.getElementById('unknown-modal').classList.remove('hidden');
      }
    }

    function cancelScan() {
      document.getElementById('product-info').classList.add('hidden');
      currentProduct = null;
      isProcessingScan = false;
      try { html5QrCode.resume(); } catch(e){}
    }

    function closeUnknownModal() {
      document.getElementById('unknown-modal').classList.add('hidden');
      tempBarcode = "";
      isProcessingScan = false;
      try { html5QrCode.resume(); } catch(e){}
    }

    function goToRegisterProduct() {
      document.getElementById('unknown-modal').classList.add('hidden');
      document.getElementById('new-barcode').value = tempBarcode;
      switchTab('manage');
      tempBarcode = "";
      isProcessingScan = false;
    }

    function generateRandomBarcode() {
      let uniqueCode = "";
      do {
        uniqueCode = "90" + Math.floor(1000 + Math.random() * 9000);
      } while (database[uniqueCode]);

      document.getElementById('new-barcode').value = uniqueCode;
    }

    function saveProduct() {
      const barcode = document.getElementById('new-barcode').value.trim();
      const name = document.getElementById('new-name').value.trim();
      const price = parseInt(document.getElementById('new-price').value);

      if (!barcode || !name || isNaN(price)) {
        alert("لطفاً تمامی فیلدها را به درستی وارد کنید.");
        return;
      }

      database[barcode] = { name: name, price: price };
      localStorage.setItem('grocery_db', JSON.stringify(database));
      
      document.getElementById('new-barcode').value = '';
      document.getElementById('new-name').value = '';
      document.getElementById('new-price').value = '';
      renderProductsList();
      
      // بازگشت به تب اسکن و فعال‌سازی مجدد دوربین
      switchTab('scan');
    }

    function prepareBatchPrint(barcode) {
      selectedPrintItem = { barcode: barcode, ...database[barcode] };
      document.getElementById('selected-print-title').innerText = `کالا: ${selectedPrintItem.name} (${selectedPrintItem.price.toLocaleString()} تومان)`;
      document.getElementById('batch-print-box').classList.remove('hidden');
    }

    function cancelPrint() {
      selectedPrintItem = null;
      document.getElementById('batch-print-box').classList.add('hidden');
    }

    function executeBatchPrint() {
      if (!selectedPrintItem) return;

      const count = parseInt(document.getElementById('print-count').value) || 24;
      const printContainer = document.getElementById('print-page-a4');
      printContainer.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const svgId = `print-svg-${i}`;
        const cardHtml = `
          <div class="label-card">
            <div style="font-size: 11px; font-weight: bold; margin-bottom: 2px;">${selectedPrintItem.name}</div>
            <svg id="${svgId}"></svg>
            <div style="font-size: 10px; font-weight: bold; margin-top: 2px;">${selectedPrintItem.price.toLocaleString()} تومان</div>
          </div>
        `;
        printContainer.innerHTML += cardHtml;
      }

      for (let i = 0; i < count; i++) {
        JsBarcode(`#print-svg-${i}`, selectedPrintItem.barcode, {
          format: "CODE128",
          width: 1.5,
          height: 35,
          displayValue: true,
          fontSize: 10
        });
      }

      printContainer.classList.remove('hidden');
      window.print();
      printContainer.classList.add('hidden');
    }

    function changeQty(amount) {
      const qtyInput = document.getElementById('quantity');
      let currentVal = parseInt(qtyInput.value) || 1;
      currentVal += amount;
      if (currentVal < 1) currentVal = 1;
      qtyInput.value = currentVal;
    }

    function switchTab(tab) {
      if (tab === 'scan') {
        document.getElementById('tab-scan').classList.remove('hidden');
        document.getElementById('tab-manage').classList.add('hidden');
        document.getElementById('tab-scan-btn').className = "flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600";
        document.getElementById('tab-manage-btn').className = "flex-1 py-2 font-bold text-gray-500";
        isProcessingScan = false;
        try { html5QrCode.resume(); } catch(e){}
      } else {
        document.getElementById('tab-scan').classList.add('hidden');
        document.getElementById('tab-manage').classList.remove('hidden');
        document.getElementById('tab-manage-btn').className = "flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600";
        document.getElementById('tab-scan-btn').className = "flex-1 py-2 font-bold text-gray-500";
        renderProductsList();
      }
    }

    function addToCart() {
      if (!currentProduct) return;
      const qty = parseInt(document.getElementById('quantity').value) || 1;
      cart.push({ name: currentProduct.name, price: currentProduct.price, quantity: qty, total: currentProduct.price * qty });
      updateCartUI();
      document.getElementById('product-info').classList.add('hidden');
      document.getElementById('quantity').value = 1;
      currentProduct = null;
      isProcessingScan = false;
      try { html5QrCode.resume(); } catch(e){}
    }

    function updateCartUI() {
      const cartList = document.getElementById('cart-list');
      const totalPriceEl = document.getElementById('total-price');
      if (cart.length === 0) {
        cartList.innerHTML = '<li class="py-2 text-center text-gray-400">هنوز کالایی اضافه نشده است.</li>';
        totalPriceEl.innerText = "0";
        return;
      }
      cartList.innerHTML = '';
      let sum = 0;
      cart.forEach((item, index) => {
        sum += item.total;
        cartList.innerHTML += `
          <li class="py-2 flex justify-between items-center">
            <div>
              <span class="font-medium text-gray-800">${item.name}</span>
              <span class="text-xs text-gray-400 block">${item.quantity} عدد × ${item.price.toLocaleString()}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-semibold">${item.total.toLocaleString()} تومان</span>
              <button onclick="removeFromCart(${index})" class="text-red-500 font-bold px-1 text-xs">✕</button>
            </div>
          </li>`;
      });
      totalPriceEl.innerText = sum.toLocaleString();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function exportCSV() {
      let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
      Object.keys(database).forEach(barcode => {
        const item = database[barcode];
        csvContent += `${barcode},${item.name},${item.price}\n`;
      });
      const link = document.createElement("a");
      link.setAttribute("href", encodeURI(csvContent));
      link.setAttribute("download", "grocery_products.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function renderProductsList() {
      const listEl = document.getElementById('products-list');
      const keys = Object.keys(database);
      document.getElementById('products-count').innerText = keys.length;

      if (keys.length === 0) {
        listEl.innerHTML = '<p class="text-center text-xs text-gray-400 py-2">هیچ کالایی ثبت نشده است.</p>';
        return;
      }

      listEl.innerHTML = '';
      keys.forEach((barcode) => {
        const item = database[barcode];
        listEl.innerHTML += `
          <div class="flex justify-between items-center p-2 bg-white rounded border text-xs">
            <div>
              <p class="font-bold text-gray-800">${item.name}</p>
              <p class="text-gray-400 dir-ltr text-right">${barcode} - ${item.price.toLocaleString()} تومان</p>
            </div>
            <div class="flex gap-1">
              <button onclick="prepareBatchPrint('${barcode}')" class="text-blue-600 bg-blue-50 px-2 py-1 rounded font-bold">🖨️ چاپ A4</button>
              <button onclick="deleteProduct('${barcode}')" class="text-red-500 bg-red-50 px-2 py-1 rounded">حذف</button>
            </div>
          </div>
        `;
      });
    }

    function deleteProduct(barcode) {
      if (confirm("آیا از حذف این کالا مطمئن هستید؟")) {
        delete database[barcode];
        localStorage.setItem('grocery_db', JSON.stringify(database));
        renderProductsList();
      }
    }

    async function sendToTelegram() {
      if (cart.length === 0) { alert("سبد خرید خالی است!"); return; }

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;
      sendBtn.innerText = "در حال ارسال...";

      let text = "🛒 <b>فاکتور جدید خرید</b>\n\n";
      let totalSum = 0;
      cart.forEach((item, i) => {
        text += `${i + 1}. <b>${item.name}</b>\n   تعداد: ${item.quantity} | قیمت: ${item.total.toLocaleString()} تومان\n`;
        totalSum += item.total;
      });
      text += `\n💰 <b>جمع کل: ${totalSum.toLocaleString()} تومان</b>`;

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();

        if (response.ok && data.ok) {
          alert("فاکتور با موفقیت به تلگرام ارسال شد!");
          cart = [];
          updateCartUI();
        } else {
          alert("خطا در ارسال به تلگرام. تنظیمات Worker را بررسی کنید.");
        }
      } catch (err) {
        alert("ارتباط با Worker تلگرام برقرار نشد.");
        console.error("Error sending message:", err);
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "ارسال فاکتور به تلگرام";
      }
    }

    window.addEventListener('DOMContentLoaded', startScanner);
  </script>
</body>
</html>
