<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم فروش و مدیریت شبکه ای مغازه</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    #reader video { object-fit: cover !important; border-radius: 0.75rem; }
    
    @media print {
      body * { visibility: hidden; }
      #print-page-a4, #print-page-a4 * { visibility: visible; }
      #print-page-a4 { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
      @page { size: A4 portrait; margin: 8mm; }
      .a4-page {
        width: 100%; height: 275mm; display: grid !important;
        grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(8, 1fr);
        gap: 4mm; box-sizing: border-box; page-break-after: always; break-after: page;
      }
      .a4-page:last-child { page-break-after: auto; break-after: auto; }
      .label-card {
        border: 1px dashed #bbb; padding: 4px; text-align: center; border-radius: 6px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        overflow: hidden; box-sizing: border-box;
      }
      .label-card svg { max-width: 95%; max-height: 60%; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-3 md:p-6 font-sans select-none">

  <!-- ==================== صفحه ورود با رمز عبور ==================== -->
  <div id="login-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
      <div class="text-4xl mb-3">🔐</div>
      <h2 class="font-bold text-gray-800 text-xl mb-1">ورود فروشندگان</h2>
      <p class="text-xs text-gray-500 mb-4">جهت دسترسی به لیست محصولات رمز عبور را وارد کنید</p>
      
      <input type="password" id="app-password" placeholder="رمز عبور" class="w-full text-center text-lg p-3 border rounded-xl mb-3 outline-none focus:border-blue-600 font-mono">
      <button onclick="login()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">
        ورود به برنامه
      </button>
      <p id="login-error" class="text-xs text-red-500 font-bold mt-3 hidden">رمز عبور نادرست است!</p>
    </div>
  </div>

  <!-- ==================== بدنه اصلی برنامه ==================== -->
  <div id="main-app" class="max-w-md mx-auto bg-white rounded-2xl shadow-md overflow-hidden p-5 hidden">
    
    <!-- تب‌های بالای صفحه -->
    <div class="flex border-b mb-4">
      <button id="tab-scan-btn" onclick="switchTab('scan')" class="flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600">فروش و اسکن</button>
      <button id="tab-manage-btn" onclick="switchTab('manage')" class="flex-1 py-2 font-bold text-gray-500">مدیریت اجناس</button>
    </div>

    <!-- ==================== بخش فروش و اسکن ==================== -->
    <div id="tab-scan">
      <div class="relative mb-4">
        <div id="reader" class="w-full rounded-xl border overflow-hidden bg-black min-h-[220px]"></div>
        <button id="torch-btn" onclick="toggleTorch()" class="hidden absolute top-3 left-3 bg-white/80 backdrop-blur-md text-gray-800 p-2 rounded-lg text-xs font-bold shadow z-10 flex items-center gap-1">
          🔦 چراغ‌قوه
        </button>
      </div>

      <!-- اطلاعات محصول اسکن شده -->
      <div id="product-info" class="hidden bg-blue-50 p-4 rounded-xl border border-blue-100 mb-4">
        <h2 id="product-name" class="font-bold text-gray-800 text-lg mb-1"></h2>
        <p class="text-sm text-gray-600 mb-3">قیمت واحد: <span id="product-price" class="font-semibold text-blue-600"></span> تومان</p>
        
        <div class="flex items-center justify-between gap-2 mb-3">
          <span class="text-sm font-medium text-gray-700">تعداد / مقدار:</span>
          <div class="flex items-center border border-gray-300 rounded-xl bg-white overflow-hidden shadow-sm">
            <button onclick="changeQty(-1)" class="w-12 h-11 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold text-xl active:bg-gray-300 transition flex items-center justify-center">−</button>
            <input type="number" id="quantity" value="1" min="1" readonly class="w-14 text-center font-bold text-lg text-blue-700 bg-transparent outline-none">
            <button onclick="changeQty(1)" class="w-12 h-11 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold text-xl active:bg-gray-300 transition flex items-center justify-center">+</button>
          </div>
        </div>

        <div class="flex gap-2">
          <button onclick="addToCart()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow">
            افزودن به فاکتور
          </button>
          <button onclick="cancelScan()" class="bg-gray-200 text-gray-700 px-4 py-3 rounded-xl font-bold hover:bg-gray-300 transition">
            انصراف
          </button>
        </div>
      </div>

      <!-- سبد خرید -->
      <div class="border-t pt-4">
        <h3 class="font-bold text-gray-700 mb-2">اقلام فاکتور:</h3>
        <ul id="cart-list" class="divide-y divide-gray-100 text-sm text-gray-600 mb-4 min-h-[50px]">
          <li class="py-2 text-center text-gray-400">هنوز کالایی اضافه نشده است.</li>
        </ul>

        <div class="flex justify-between items-center font-bold text-lg text-gray-800 border-t pt-3 mb-4">
          <span>جمع کل:</span>
          <div><span id="total-price">0</span> <span class="text-sm font-normal">تومان</span></div>
        </div>

        <button id="send-btn" onclick="sendToTelegram()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition shadow">
          ارسال فاکتور به تلگرام
        </button>
      </div>
    </div>

    <!-- ==================== بخش مدیریت اجناس ==================== -->
    <div id="tab-manage" class="hidden">
      <!-- ثبت کالا -->
      <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-4">
        <h3 class="font-bold text-gray-800 mb-3 text-sm">ثبت کالا (با بارکد دستی یا تولید خودکار)</h3>
        <div class="space-y-3">
          <div>
            <label class="text-xs text-gray-600 block mb-1">کد بارکد:</label>
            <div class="flex gap-2">
              <input type="text" id="new-barcode" placeholder="بارکد کالا" class="flex-1 p-2 border rounded-lg text-sm dir-ltr">
              <button onclick="generateRandomBarcode()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg text-xs font-bold transition">
                ⚡ تولید بارکد (۹۰)
              </button>
            </div>
          </div>

          <div>
            <label class="text-xs text-gray-600 block mb-1">نام کالا:</label>
            <input type="text" id="new-name" placeholder="مثلاً: روغن مایع ۱ لیتر" class="w-full p-2 border rounded-lg text-sm">
          </div>

          <div>
            <label class="text-xs text-gray-600 block mb-1">قیمت (تومان):</label>
            <input type="text" id="new-price" oninput="formatPriceInput(this)" placeholder="مثلاً: ۶۵,۰۰۰" class="w-full p-2 border rounded-lg text-sm dir-ltr text-right">
          </div>

          <button id="save-btn" onclick="saveProduct()" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-indigo-700 transition">
            ذخیره کالا در سرور ابری
          </button>
        </div>
      </div>

      <!-- زیربرگه‌ها برای تفکیک همه محصولات و چاپ بارکد سیستم -->
      <div class="border-t pt-3">
        <div class="flex bg-gray-100 p-1 rounded-xl mb-3 text-xs font-bold">
          <button id="subtab-all-btn" onclick="switchSubTab('all')" class="flex-1 py-1.5 rounded-lg bg-white shadow-sm text-blue-600">
            همه کالاها (<span id="all-count">0</span>)
          </button>
          <button id="subtab-print-btn" onclick="switchSubTab('print')" class="flex-1 py-1.5 rounded-lg text-gray-500">
            🖨️ چاپ بارکد سیستم (<span id="system-count">0</span>)
          </button>
        </div>

        <!-- لیست ۱: تمامی اجناس -->
        <div id="subtab-all-content">
          <div id="all-products-list" class="space-y-2 max-h-72 overflow-y-auto"></div>
        </div>

        <!-- لیست ۲: مخصوص چاپ بارکدهای سیستمی -->
        <div id="subtab-print-content" class="hidden">
          <div class="flex justify-between items-center bg-blue-50 p-2.5 rounded-xl border border-blue-100 mb-3">
            <label class="flex items-center gap-1.5 text-xs font-bold text-blue-900 cursor-pointer">
              <input type="checkbox" id="select-all-cb" onchange="toggleSelectAll(this.checked)" class="w-4 h-4 rounded text-blue-600">
              <span>انتخاب همه</span>
            </label>

            <button onclick="executeMultiPrint()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition shadow">
              🖨️ چاپ A4 موارد انتخابی
            </button>
          </div>
          <div id="system-products-list" class="space-y-2 max-h-72 overflow-y-auto"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- پاپ‌آپ ثبت کالای ناشناخته -->
  <div id="unknown-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 max-w-sm w-full text-center shadow-xl">
      <div class="text-3xl mb-2">⚠️</div>
      <h3 class="font-bold text-gray-800 text-lg mb-2">کالای ناشناخته</h3>
      <p class="text-sm text-gray-600 mb-4">بارکد <span id="modal-barcode" class="font-bold font-mono text-blue-600"></span> در سیستم پیدا نشد.</p>
      <div class="flex gap-2">
        <button onclick="goToRegisterProduct()" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-blue-700">
          ثبت کالا
        </button>
        <button onclick="closeUnknownModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl font-bold text-sm hover:bg-gray-300">
          بستن
        </button>
      </div>
    </div>
  </div>

  <!-- منطقه مخصوص ساخت و چاپ برگه A4 -->
  <div id="print-page-a4" class="hidden"></div>

  <script>
    const WORKER_URL = "https://godrati.ez-1332d6.workers.dev";
    let userPassword = "";
    let database = {};
    let currentProduct = null;
    let tempBarcode = "";
    let cart = [];
    let html5QrCode = null;
    let isTorchOn = false;
    let isProcessingScan = false;

    // ۱. ورود به سیستم و تایید رمز عبور
    async function login() {
      const passInput = document.getElementById('app-password').value.trim();
      if (!passInput) return;

      try {
        const res = await fetch(`${WORKER_URL}/products`, {
          headers: { "Authorization": passInput }
        });

        if (res.status === 401) {
          document.getElementById('login-error').classList.remove('hidden');
          return;
        }

        userPassword = passInput;
        database = await res.json();
        
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        
        startScanner();
      } catch (e) {
        alert("خطا در ارتباط با سرور. اینترنت خود را بررسی کنید.");
      }
    }

    // ۲. دریافت آخرین اطلاعات از سرور ابری
    async function fetchDatabaseFromCloud() {
      try {
        const res = await fetch(`${WORKER_URL}/products`, {
          headers: { "Authorization": userPassword }
        });
        if (res.ok) {
          database = await res.json();
        }
      } catch (e) {
        console.error("خطا در همگام‌سازی:", e);
      }
    }

    // ۳. ارسال اطلاعات جدید به سرور ابری
    async function saveDatabaseToCloud() {
      try {
        await fetch(`${WORKER_URL}/products`, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": userPassword
          },
          body: JSON.stringify(database)
        });
      } catch (e) {
        alert("خطا در ذخیره ابری اطلاعات!");
      }
    }

    function toEnglishDigits(str) {
      return str.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
    }

    function formatPriceInput(input) {
      let value = toEnglishDigits(input.value).replace(/\D/g, '');
      input.value = value ? Number(value).toLocaleString('en-US') : '';
    }

    function getCleanPrice(inputValue) {
      const cleanValue = toEnglishDigits(inputValue).replace(/,/g, '').trim();
      return parseInt(cleanValue, 10);
    }

    const scanConfig = {
      fps: 15, qrbox: { width: 260, height: 160 }, aspectRatio: 1.0,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E, Html5QrcodeSupportedFormats.CODE_39
      ]
    };

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start({ facingMode: "environment" }, scanConfig, onScanSuccess)
      .then(() => {
        const capabilities = html5QrCode.getRunningTrackCapabilities();
        if (capabilities.torch) document.getElementById('torch-btn').classList.remove('hidden');
      }).catch(err => console.error("خطا دوربین:", err));
    }

    function toggleTorch() {
      isTorchOn = !isTorchOn;
      html5QrCode.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] });
    }

    async function onScanSuccess(decodedText) {
      if (isProcessingScan) return;
      isProcessingScan = true;
      try { html5QrCode.pause(); } catch(e){}

      await fetchDatabaseFromCloud(); // بررسی جدیدترین اجناس ثبت شده توسط سایر فروشندگان
      const product = database[decodedText];

      if (product) {
        currentProduct = { barcode: decodedText, ...product };
        document.getElementById('product-name').innerText = product.name;
        document.getElementById('product-price').innerText = product.price.toLocaleString();
        document.getElementById('quantity').value = 1;
        document.getElementById('product-info').classList.remove('hidden');
      } else {
        tempBarcode = decodedText;
        document.getElementById('modal-barcode').innerText = decodedText;
        document.getElementById('unknown-modal').classList.remove('hidden');
      }
    }

    function cancelScan() {
      document.getElementById('product-info').classList.add('hidden');
      currentProduct = null;
      isProcessingScan = false;
      try { html5QrCode.resume(); } catch(e){}
    }

    function closeUnknownModal() {
      document.getElementById('unknown-modal').classList.add('hidden');
      tempBarcode = "";
      isProcessingScan = false;
      try { html5QrCode.resume(); } catch(e){}
    }

    function goToRegisterProduct() {
      document.getElementById('unknown-modal').classList.add('hidden');
      document.getElementById('new-barcode').value = tempBarcode;
      switchTab('manage');
      tempBarcode = "";
      isProcessingScan = false;
    }

    function generateRandomBarcode() {
      let uniqueCode = "";
      do {
        uniqueCode = "90" + Math.floor(1000 + Math.random() * 9000);
      } while (database[uniqueCode]);

      document.getElementById('new-barcode').value = uniqueCode;
    }

    async function saveProduct() {
      const barcode = document.getElementById('new-barcode').value.trim();
      const name = document.getElementById('new-name').value.trim();
      const price = getCleanPrice(document.getElementById('new-price').value);

      if (!barcode || !name || isNaN(price)) {
        alert("لطفاً تمامی فیلدها را به درستی وارد کنید.");
        return;
      }

      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.innerText = "در حال ذخیره‌سازی ابری...";

      database[barcode] = { name: name, price: price };
      await saveDatabaseToCloud();
      
      document.getElementById('new-barcode').value = '';
      document.getElementById('new-name').value = '';
      document.getElementById('new-price').value = '';
      
      saveBtn.disabled = false;
      saveBtn.innerText = "ذخیره کالا در سرور ابری";

      alert("محصول همگام‌سازی شد.");
      renderProductsList();
      switchTab('scan');
    }

    function switchSubTab(sub) {
      if (sub === 'all') {
        document.getElementById('subtab-all-content').classList.remove('hidden');
        document.getElementById('subtab-print-content').classList.add('hidden');
        document.getElementById('subtab-all-btn').className = "flex-1 py-1.5 rounded-lg bg-white shadow-sm text-blue-600 font-bold";
        document.getElementById('subtab-print-btn').className = "flex-1 py-1.5 rounded-lg text-gray-500 font-bold";
      } else {
        document.getElementById('subtab-all-content').classList.add('hidden');
        document.getElementById('subtab-print-content').classList.remove('hidden');
        document.getElementById('subtab-print-btn').className = "flex-1 py-1.5 rounded-lg bg-white shadow-sm text-blue-600 font-bold";
        document.getElementById('subtab-all-btn').className = "flex-1 py-1.5 rounded-lg text-gray-500 font-bold";
      }
    }

    function toggleSelectAll(isChecked) {
      document.querySelectorAll('.item-cb').forEach(cb => cb.checked = isChecked);
    }

    function changePrintCount(barcode, delta) {
      const input = document.getElementById(`print-count-${barcode}`);
      let val = (parseInt(input.value) || 1) + delta;
      if (val < 1) val = 1;
      input.value = val;
    }

    async function renderProductsList() {
      await fetchDatabaseFromCloud();
      const allBarcodes = Object.keys(database);
      const systemBarcodes = allBarcodes.filter(b => b.startsWith('90'));

      document.getElementById('all-count').innerText = allBarcodes.length;
      document.getElementById('system-count').innerText = systemBarcodes.length;

      const allListEl = document.getElementById('all-products-list');
      allListEl.innerHTML = allBarcodes.length === 0 ? '<p class="text-center text-xs text-gray-400 py-3">هیچ کالایی یافت نشد.</p>' : '';
      
      allBarcodes.forEach(barcode => {
        const item = database[barcode];
        allListEl.innerHTML += `
          <div class="flex items-center justify-between p-2.5 bg-white rounded-xl border border-gray-200 text-xs shadow-sm">
            <div>
              <p class="font-bold text-gray-800">${item.name}</p>
              <p class="text-gray-400 dir-ltr text-right font-mono">${barcode} - ${item.price.toLocaleString()} تومان</p>
            </div>
            <button onclick="deleteProduct('${barcode}')" class="text-red-500 hover:bg-red-50 p-1.5 rounded-lg transition">🗑️</button>
          </div>`;
      });

      const sysListEl = document.getElementById('system-products-list');
      sysListEl.innerHTML = systemBarcodes.length === 0 ? '<p class="text-center text-xs text-gray-400 py-3">هیچ کالا با بارکد سیستمی (۹۰) یافت نشد.</p>' : '';
      
      systemBarcodes.forEach(barcode => {
        const item = database[barcode];
        sysListEl.innerHTML += `
          <div class="flex items-center justify-between p-2.5 bg-white rounded-xl border border-gray-200 text-xs shadow-sm">
            <div class="flex items-center gap-2">
              <input type="checkbox" value="${barcode}" class="item-cb w-4 h-4 rounded text-blue-600 cursor-pointer">
              <div>
                <p class="font-bold text-gray-800">${item.name}</p>
                <p class="text-gray-400 dir-ltr text-right font-mono">${barcode} - ${item.price.toLocaleString()} تومان</p>
              </div>
            </div>
            <div class="flex items-center border border-gray-300 rounded-lg bg-gray-50 overflow-hidden">
              <button onclick="changePrintCount('${barcode}', -1)" class="w-6 h-6 bg-gray-200 hover:bg-gray-300 font-bold text-gray-700 flex items-center justify-center">-</button>
              <input type="number" id="print-count-${barcode}" value="1" min="1" readonly class="w-8 text-center font-bold bg-transparent outline-none text-xs text-blue-700">
              <button onclick="changePrintCount('${barcode}', 1)" class="w-6 h-6 bg-gray-200 hover:bg-gray-300 font-bold text-gray-700 flex items-center justify-center">+</button>
            </div>
          </div>`;
      });
    }

    async function deleteProduct(barcode) {
      if (confirm("آیا از حذف این کالا مطمئن هستید؟")) {
        delete database[barcode];
        await saveDatabaseToCloud();
        renderProductsList();
      }
    }

    function executeMultiPrint() {
      const checkboxes = document.querySelectorAll('.item-cb:checked');
      if (checkboxes.length === 0) { alert("لطفاً حداقل یک کالا را انتخاب کنید."); return; }

      const allBarcodesToPrint = [];
      checkboxes.forEach(cb => {
        const barcode = cb.value;
        const count = parseInt(document.getElementById(`print-count-${barcode}`).value) || 1;
        if (database[barcode]) {
          for (let i = 0; i < count; i++) {
            allBarcodesToPrint.push({ barcode, name: database[barcode].name, price: database[barcode].price });
          }
        }
      });

      const printContainer = document.getElementById('print-page-a4');
      printContainer.innerHTML = '';
      const ITEMS_PER_PAGE = 24;
      let currentPage = null;
      const svgTasks = [];

      allBarcodesToPrint.forEach((item, index) => {
        if (index % ITEMS_PER_PAGE === 0) {
          currentPage = document.createElement('div');
          currentPage.className = 'a4-page';
          printContainer.appendChild(currentPage);
        }

        const svgId = `multi-print-svg-${index}`;
        const card = document.createElement('div');
        card.className = 'label-card';
        card.innerHTML = `
          <div style="font-size: 11px; font-weight: bold; margin-bottom: 2px;">${item.name}</div>
          <svg id="${svgId}"></svg>
          <div style="font-size: 10px; font-weight: bold; margin-top: 2px;">${item.price.toLocaleString()} تومان</div>
        `;
        currentPage.appendChild(card);
        svgTasks.push({ id: svgId, barcode: item.barcode });
      });

      svgTasks.forEach(task => {
        JsBarcode(`#${task.id}`, task.barcode, { format: "CODE128", width: 1.5, height: 38, displayValue: true, fontSize: 10 });
      });

      printContainer.classList.remove('hidden');
      window.print();
      printContainer.classList.add('hidden');
    }

    function changeQty(amount) {
      const qtyInput = document.getElementById('quantity');
      let currentVal = (parseInt(qtyInput.value) || 1) + amount;
      if (currentVal < 1) currentVal = 1;
      qtyInput.value = currentVal;
    }

    function switchTab(tab) {
      if (tab === 'scan') {
        document.getElementById('tab-scan').classList.remove('hidden');
        document.getElementById('tab-manage').classList.add('hidden');
        document.getElementById('tab-scan-btn').className = "flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600";
        document.getElementById('tab-manage-btn').className = "flex-1 py-2 font-bold text-gray-500";
        isProcessingScan = false;
        try { html5QrCode.resume(); } catch(e){}
      } else {
        document.getElementById('tab-scan').classList.add('hidden');
        document.getElementById('tab-manage').classList.remove('hidden');
        document.getElementById('tab-manage-btn').className = "flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600";
        document.getElementById('tab-scan-btn').className = "flex-1 py-2 font-bold text-gray-500";
        renderProductsList();
      }
    }

    function addToCart() {
      if (!currentProduct) return;
      const qty = parseInt(document.getElementById('quantity').value) || 1;
      cart.push({ name: currentProduct.name, price: currentProduct.price, quantity: qty, total: currentProduct.price * qty });
      updateCartUI();
      document.getElementById('product-info').classList.add('hidden');
      document.getElementById('quantity').value = 1;
      currentProduct = null;
      isProcessingScan = false;
      try { html5QrCode.resume(); } catch(e){}
    }

    function updateCartUI() {
      const cartList = document.getElementById('cart-list');
      const totalPriceEl = document.getElementById('total-price');
      if (cart.length === 0) {
        cartList.innerHTML = '<li class="py-2 text-center text-gray-400">هنوز کالایی اضافه نشده است.</li>';
        totalPriceEl.innerText = "0";
        return;
      }
      cartList.innerHTML = '';
      let sum = 0;
      cart.forEach((item, index) => {
        sum += item.total;
        cartList.innerHTML += `
          <li class="py-2 flex justify-between items-center">
            <div>
              <span class="font-medium text-gray-800">${item.name}</span>
              <span class="text-xs text-gray-400 block">${item.quantity} عدد × ${item.price.toLocaleString()}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-semibold">${item.total.toLocaleString()} تومان</span>
              <button onclick="removeFromCart(${index})" class="text-red-500 font-bold px-1 text-xs">✕</button>
            </div>
          </li>`;
      });
      totalPriceEl.innerText = sum.toLocaleString();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    async function sendToTelegram() {
      if (cart.length === 0) { alert("سبد خرید خالی است!"); return; }

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;
      sendBtn.innerText = "در حال ارسال...";

      let text = "🛒 <b>فاکتور جدید خرید</b>\n\n";
      let totalSum = 0;
      cart.forEach((item, i) => {
        text += `${i + 1}. <b>${item.name}</b>\n   تعداد: ${item.quantity} | قیمت: ${item.total.toLocaleString()} تومان\n`;
        totalSum += item.total;
      });
      text += `\n💰 <b>جمع کل: ${totalSum.toLocaleString()} تومان</b>`;

      try {
        const response = await fetch(`${WORKER_URL}/telegram`, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": userPassword
          },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        if (response.ok && data.ok) {
          alert("فاکتور با موفقیت به تلگرام ارسال شد!");
          cart = [];
          updateCartUI();
        } else {
          alert("خطا در ارسال به تلگرام.");
        }
      } catch (err) {
        alert("ارتباط با سرور برقرار نشد.");
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "ارسال فاکتور به تلگرام";
      }
    }
  </script>
</body>
</html>
